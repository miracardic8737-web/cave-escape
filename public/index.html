<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>Mağara Kaçışı</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- LOBBY -->
<div id="lobby">
  <div id="lobbyMain">
    <h1>🚗 Mağara Kaçışı</h1>
    <p class="sub">Sonsuz Koşu · Multiplayer · Kovalayan Düşman</p>

    <div class="panels">
      <div class="panel">
        <h3>Oda Oluştur</h3>
        <input id="roomName" type="text" placeholder="Oda adı" value="Mağara" maxlength="20"/>
        <label class="toggle-row">
          <input type="checkbox" id="chainToggle"/>
          <span class="tog"></span>
          <span>⛓ Zincir Modu</span>
        </label>
        <button onclick="createRoom()">+ Oluştur</button>
      </div>
      <div class="panel">
        <div class="rh"><h3>Açık Odalar</h3><button class="sm" onclick="socket.emit('getRoomList')">↻</button></div>
        <div id="roomList"><p class="dim">Yükleniyor...</p></div>
      </div>
    </div>
    <p id="lobbyMsg" class="msg"></p>
    <p class="hint">← → veya A D ile sola/sağa</p>
  </div>

  <div id="waitingRoom" style="display:none">
    <div class="wbox">
      <h2 id="wRoomName">Oda</h2>
      <div id="wPlayers"></div>
      <div class="wbtns">
        <button id="readyBtn" onclick="setReady()">✅ Hazır</button>
        <button class="sec" onclick="leaveRoom()">← Geri</button>
      </div>
      <p class="dim">Herkes hazır olunca başlar</p>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud" style="display:none">
  <div id="score">0m</div>
  <div id="chaser">👹 --m</div>
  <div id="spd"><span id="spdVal">0</span><small>km/h</small></div>
  <div id="plist"></div>
  <canvas id="mm" width="90" height="130"></canvas>
</div>

<div id="countdown" style="display:none"></div>
<div id="notif"></div>

<div id="deathScreen" style="display:none">
  <div class="modal">
    <div style="font-size:3rem">💀</div>
    <h2>Yakalandın!</h2>
    <p>Mesafe: <b id="deathDist">0m</b></p>
    <button onclick="location.reload()">Tekrar</button>
  </div>
</div>

<div id="endScreen" style="display:none">
  <div class="modal">
    <h2>🏆 Skor</h2>
    <div id="lb"></div>
    <button onclick="location.reload()">Tekrar</button>
  </div>
</div>

<!-- MOBİL KONTROLLER -->
<div id="mctrl" style="display:none">
  <div id="steers">
    <button id="bL" class="sbtn">◀</button>
    <button id="bR" class="sbtn">▶</button>
  </div>
  <div id="pedals">
    <button id="bG" class="pbtn green">⬆<br><small>GAZ</small></button>
    <button id="bB" class="pbtn red">⬇<br><small>FREN</small></button>
  </div>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
